body:
  text: 洛陽名園記地理類七古蹟之屬提要臣等謹案洛陽名園記一卷宋李格非撰格非字文叔濟南人元祐末為國子博士紹聖初進禮部郎提㸃京東刑獄以黨籍罷是書記洛中園圃自富弼以下凡十九所格非自跋云天下之治亂候于洛陽之盛衰洛陽之盛衰候于園圃之興廢蓋追思當時賢佐名卿勳業隆盛能享其樂非徒誇臺榭池館之美也書録解題郡齊讀書志俱載李格非撰惟毛晉津逮祕書題曰華州李豸考邵博聞見後録第十七卷內全載此書不遺一字實標格非之名同時之人不應有誤知毛晉之誤題審矣王士禎居易録記是書前有紹興中張琰德和序首曰山東李文叔云云此本亦佚之殆又後人因標題姓名與序不符而刋除其文歟乾隆四十六年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀洛陽名園記原序山東李文叔記洛陽名園凡十有九處自富鄭公而終於吕文穆其聲名氣熖見於功德者遺芳餘烈足以想像其賢其次世位尊崇與夫財力雄盛者亦足以知其人經營生理之勞又其次僧坊以清淨化度羣品而乃斥餘事種植灌溉奪造化之功與王公大姓相軋夫洛陽帝王東西宅為天下之中土圭日影得隂陽之和嵩少瀍澗鍾山水之秀名公大人為冠冕之望天匠地孕為花卉之奇加以富貴利達優游閒暇之士配造物而相嫵媚爭妍競巧於鼎新革故之際館榭池臺風俗之習嵗時嬉遊聲詩之播揚圗畫之傳寫古今華夏莫比觀文叔之記可以致近世之盛可以信文叔之言為不茍且夫識明智審則慮事精而信道篤隨其所見淺深為近逺大小之應於熙寧變更天下風靡有所必不可者大丞相司馬公為首後十五年無一不如公料者至今明驗大效與始言若合符節文叔方洛陽盛時足迹目力心思之所及亦逺見髙覽知今日之禍曰洛陽可以為天下治亂之候又曰公卿髙進於朝放乎一巳之私意忘天下之治忽嗚呼可謂知言哉文叔在元祐官太學丁建中靖國再用邪朋竄為黨人女適趙相挺之子亦能詩上趙相救其父云何况人間父子情識者哀之今記稱潞公年九十而杖屨東西按太師丙午生正紹聖乙亥嵗譴逐嶺表立黨之二年誣謗宣仁聖烈廢降昭慈獻聖羣隂巳壯芽孽弄權宰相不必斥其名後內相王明叟指言紹聖當國之人如操舟者當左而右當右而左旁觀者為之寒心與文叔所言放乎一巳之私意而忘天下之治忽若相終始愚故曰其言真不茍且也噫繁華盛麗過盡一時至於荆棘銅駝遍於伊洛雖宫室苑囿滌除皆盡然一廢一興循天地無盡藏安得光明盛大復有如洛陽衆賢佐中興之業乎季父浮休侍郎詠長安廢興地有詩云憶昔開元全盛日漢苑隋宫巳黍離覆轍由來皆在說今人還起古人悲感而思治世之難遇嘉賢者之用心故重言以書其首紹興八年三月望日豳國張琰德和序
